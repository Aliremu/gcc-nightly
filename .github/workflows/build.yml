name: Build GCC

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      gcc_ref:
        description: GCC branch, tag or full commit hash (master = trunk)
        required: true
        default: master
      targets:
        description: Comma-separated builds (windows, linux-native, linux-arm64)
        required: true
        default: windows,linux-native,linux-arm64

# One release at a time, so tags and the default branch update in order.
concurrency:
  group: gcc-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCC_URL: https://github.com/gcc-mirror/gcc.git
  GCC_REF: ${{ inputs.gcc_ref || 'master' }}
  TARGETS: ${{ inputs.targets || 'windows,linux-native,linux-arm64' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      short: ${{ steps.resolve.outputs.short }}
      version: ${{ steps.resolve.outputs.version }}
      date: ${{ steps.resolve.outputs.date }}
      tag: ${{ steps.resolve.outputs.tag }}
      nightly: ${{ steps.resolve.outputs.nightly }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve GCC ref and release tag
        id: resolve
        run: |
          # Fetch only the commit, plus the one blob read below.
          git init -q gcc
          git -C gcc fetch -q --depth 1 --filter=blob:none "$GCC_URL" "$GCC_REF"
          commit="$(git -C gcc rev-parse FETCH_HEAD)"
          short="${commit:0:12}"
          version="$(git -C gcc show FETCH_HEAD:gcc/BASE-VER)"
          date="$(date -u +%Y%m%d)"
          tag="$version-$date-$short"
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" >/dev/null; then
            tag="$tag-r$GITHUB_RUN_NUMBER"
          fi

          matrix="$(jq -cRn --arg t "$TARGETS" '$t | split(",") | map(gsub("\\s"; "")) | map(select(length > 0)) | unique')"
          for target in $(jq -r '.[]' <<< "$matrix"); do
            case "$target" in
              windows|linux-native|linux-arm64) ;;
              *) echo "::error::Unknown target: $target"; exit 1 ;;
            esac
          done
          # Only full trunk builds move the nightly Docker tags and the
          # default branch that the flake follows.
          nightly=false
          if [[ "$GCC_REF" == master && "$matrix" == '["linux-arm64","linux-native","windows"]' ]]; then
            nightly=true
          fi

          {
            echo "commit=$commit"; echo "short=$short"; echo "version=$version"
            echo "date=$date"; echo "tag=$tag"; echo "nightly=$nightly"; echo "matrix=$matrix"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: prepare
    # Set the BUILD_RUNNER repository variable to use a larger or self-hosted runner.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - name: Fetch GCC
        run: scripts/fetch-gcc.sh "${{ needs.prepare.outputs.commit }}"
      - name: Build
        env:
          # The Windows-hosted compiler reuses the cross build's runtimes.
          BUILD_TARGETS: ${{ matrix.group == 'windows' && 'windows,windows-native' || matrix.group }}
        run: scripts/build-in-docker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.group }}
          path: dist/*.tar.zst
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  docker:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      NIGHTLY: ${{ needs.prepare.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          path: dist
          merge-multiple: true
      - name: Prepare build context
        id: ctx
        run: |
          mkdir ctx
          platforms=()
          stage() { # archive name, context name
            local f; f="$(compgen -G "dist/gcc-$1-*.tar.zst" || true)"
            [[ -n "$f" ]] && ln "$f" "ctx/$2.tar.zst"
          }
          stage linux-native linux-amd64 && platforms+=(linux/amd64)
          stage linux-arm64-native linux-arm64 && platforms+=(linux/arm64)
          stage windows windows && echo "windows=true" >> "$GITHUB_OUTPUT"
          echo "platforms=$(IFS=,; echo "${platforms[*]}")" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          ls -l ctx
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Linux images (amd64 and arm64)
        if: steps.ctx.outputs.platforms != ''
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/Dockerfile
          platforms: ${{ steps.ctx.outputs.platforms }}
          push: true
          build-args: |
            GCC_COMMIT=${{ needs.prepare.outputs.commit }}
            GCC_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ steps.ctx.outputs.image }}:${{ env.TAG }}
            ${{ env.NIGHTLY == 'true' && format('{0}:nightly', steps.ctx.outputs.image) || '' }}
      - name: Windows cross-compiler image
        if: steps.ctx.outputs.windows == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            TOOLCHAIN=windows
            GCC_COMMIT=${{ needs.prepare.outputs.commit }}
            GCC_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ steps.ctx.outputs.image }}:windows-${{ env.TAG }}
            ${{ env.NIGHTLY == 'true' && format('{0}:windows-nightly', steps.ctx.outputs.image) || '' }}

  release:
    needs: [prepare, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COMMIT: ${{ needs.prepare.outputs.commit }}
      SHORT: ${{ needs.prepare.outputs.short }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DATE: ${{ needs.prepare.outputs.date }}
      TAG: ${{ needs.prepare.outputs.tag }}
      NIGHTLY: ${{ needs.prepare.outputs.nightly }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          path: dist
          merge-multiple: true
      - uses: cachix/install-nix-action@v31
      - name: Point the flake at the release assets
        run: |
          scripts/nix-sources.sh dist \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" "$VERSION"
          git add nix/sources
      - name: Test the flake
        run: |
          shopt -s nullglob
          archives=(dist/gcc-linux-native-*.tar.zst)
          if (( ${#archives[@]} == 0 )); then echo "No x86-64 archive to test"; exit 0; fi
          # Seed the store so fetchurl finds the not-yet-published asset.
          nix-store --add-fixed sha256 "${archives[@]}"
          nix build -L .#checks.x86_64-linux.hello
      - name: Commit, tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Record the built GCC commit in the submodule pointer.
          git update-index --cacheinfo "160000,$COMMIT,gcc"
          git commit -m "GCC $VERSION ($SHORT, $DATE)"
          git tag -a "$TAG" -m "GCC $VERSION built from gcc-mirror/gcc@$COMMIT"
          git push origin "refs/tags/$TAG"
          if [[ "$NIGHTLY" == true ]]; then
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi

          (cd dist && sha256sum -- *.tar.zst > SHA256SUMS)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > notes.md <<EOF
          GCC $VERSION built from gcc-mirror/gcc@$COMMIT (ref \`$GCC_REF\`).

          Docker: \`$image:$TAG\` (linux/amd64, linux/arm64), \`$image:windows-$TAG\` (MinGW-w64 cross compiler)

          Nix: \`nix shell github:$GITHUB_REPOSITORY/$TAG\`
          EOF
          gh release create "$TAG" dist/*.tar.zst dist/SHA256SUMS \
            --verify-tag --title "GCC $VERSION $DATE ($SHORT)" \
            --notes-file notes.md --latest="$NIGHTLY"
